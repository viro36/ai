{% extends 'base.html' %}
{% load static %}

{% block title %}Удаление курса{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">
                        <i class="fa-solid fa-trash-can me-2"></i>
                        Подтверждение удаления
                    </h4>
                </div>
                <div class="card-body">
                    <p class="lead">
                        Вы действительно хотите удалить курс:
                        <strong>{{ course.title }}</strong>?
                    </p>
                    <p class="text-danger">
                        <i class="fa-solid fa-exclamation-triangle me-1"></i>
                        Это действие необратимо.
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'courses:organization_courses' organization.id %}" class="btn btn-secondary">
                                <i class="fa-solid fa-times me-1"></i> Отмена
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="fa-solid fa-trash-can me-1"></i> Удалить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
