{% if career_guidance.vo_programs %}
<div class="card mb-4 shadow">
    <div class="card-header bg-success text-white">
        <h5 class="mb-0">
            <i class="fa-solid fa-graduation-cap me-2"></i>
            Направления подготовки ВО (ФГОС ВО) — {{ career_guidance.vo_programs_count }}
        </h5>
    </div>
    <div class="card-body">
        <div class="row">
            {% for p in career_guidance.vo_programs %}
                <div class="col-md-6 mb-2">
                    <div class="border rounded p-2 h-100">
                        <span class="badge bg-secondary me-1">{{ p.code }}</span>
                        <span class="badge bg-success">{{ p.education_level_display }}</span>
                        <div class="small mt-1">{{ p.name }}</div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}
