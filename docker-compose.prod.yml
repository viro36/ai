services:
  ai:
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile.prod
    command: /start-prod
    user: "appuser:appgroup"
    volumes:
      - .:/App
      - static_volume:/App/staticfiles
      - media_volume:/App/mediafiles
    expose:
      - "8000"
    env_file:
      - .env.prod
    restart: "on-failure"
    depends_on:
      - postgres-db
      - redis
    networks:
      - ai

  postgres-db:
    image: kartoza/postgis:18.3-3.6.3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file:
      - .env.prod  # ← только это
    restart: "on-failure"
    networks:
      - ai

  nginx:
    restart: always
    depends_on:
      - ai
    volumes:
      - static_volume:/App/staticfiles
      - media_volume:/App/mediafiles
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    networks:
      - ai

  redis:
    image: redis:8.6.3-alpine
    networks:
      - ai

  celery_worker:
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile.prod
    command: /start-celeryworker
    user: "celeryuser:celerygroup"
    develop:
      watch:
        - action: sync+restart
          path: ./ai
          target: /App/ai
    volumes:
      - .:/App
      - static_volume:/App/staticfiles
      - media_volume:/App/mediafiles
    env_file:
      - .env.prod
    depends_on:
      - postgres-db
      - redis
      - ai
    restart: "on-failure"
    networks:
      - ai

  flower:
    build:
      context: .
      dockerfile: ./docker/django/Dockerfile.prod
    command: /start-flower
    user: "appuser:appgroup"
    volumes:
      - .:/App:ro
      - static_volume:/App/staticfiles
      - media_volume:/App/mediafiles
    env_file:
      - .env.prod
    ports:
      - "5557:5555"
    depends_on:
      - postgres-db
      - redis
      - ai
    networks:
      - ai

networks:
  ai:
    driver: bridge

volumes:
  postgres_data:
    name: ai_postgres_data_fixed
  static_volume:
  media_volume:
